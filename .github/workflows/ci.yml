name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: music_database
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d music_database"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: >-
          python -m pip install
          --requirement requirements.txt
          --requirement requirements-dev.txt

      - name: Check formatting and code quality
        run: |
          ruff format --check src tests run.py
          ruff check src tests run.py

      - name: Audit dependencies
        run: python -m pip_audit --requirement requirements.txt

      - name: Compile sources
        run: python -m compileall -q src tests run.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_DSN: dbname=music_database user=postgres password=postgres host=localhost port=5432
